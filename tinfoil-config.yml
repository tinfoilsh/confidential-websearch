cvm-version: 0.10.4
cpus: 8
memory: 16384

containers:
  - name: "websearch-mcp"
    image: "ghcr.io/tinfoilsh/confidential-websearch@sha256:d15ff119a3339ebf209d9a8fce49a4053b488acb957ea9c63788150a6092878a" # v0.5.6
    restart: always
    networks: [web]
    env:
      - SAFEGUARD_MODEL: "gpt-oss-safeguard-120b"
      - PII_ENCLAVE: "pii-filter.tinfoil.sh"
      - PII_REPO: "tinfoilsh/confidential-pii-cpu"
      - CONTROL_PLANE_URL: "https://api.tinfoil.sh"
      - USAGE_REPORTER_ID: "websearch-mcp"
    secrets:
      - EXA_API_KEY
      - CLOUDFLARE_API_TOKEN
      - TINFOIL_API_KEY
      - USAGE_REPORTER_SECRET
      - USAGE_CONTEXT_SECRET

networks:
  web:
    egress: open

shim:
  upstream-port: 8089
  paths:
    - /mcp
    - /health
  authenticated: true
  authenticated-endpoints:
    - /mcp
