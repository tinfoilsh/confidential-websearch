cvm-version: 0.11.0
cpus: 8
memory: 16384

containers:
  - name: "websearch-mcp"
    image: "ghcr.io/tinfoilsh/confidential-websearch@sha256:f98132b617dc6a1f5c09687cf5326ae24fcf8f9cd8cde5d005555883df97e4a4" # v0.5.11
    restart: always
    networks: [web]
    env:
      - SAFEGUARD_MODEL: "gpt-oss-safeguard-120b"
      - PII_ENCLAVE: "pii-filter.tinfoil.sh"
      - PII_REPO: "tinfoilsh/confidential-pii-cpu"
      - CONTROL_PLANE_URL: "https://api.tinfoil.sh"
      - USAGE_REPORTER_ID: "websearch-mcp"
    secrets:
      - EXA_API_KEY
      - CLOUDFLARE_API_TOKEN
      - TINFOIL_API_KEY
      - USAGE_REPORTER_SECRET
      - USAGE_CONTEXT_SECRET
      - METRICS_API_KEY

networks:
  web:
    egress: open

shim:
  upstream-port: 8089
  paths:
    - /mcp
    - /health
    - /metrics
  authenticated: true
  authenticated-endpoints:
    - /mcp
    - /metrics
