cvm-version: 0.10.4
cpus: 8
memory: 16384

containers:
  - name: "websearch-mcp"
    image: "ghcr.io/tinfoilsh/confidential-websearch@sha256:c6fe85aee479da331f3c1ad816038b4a9a5697ec66a5198510f8d3267a442b76" # v0.5.5
    restart: always
    networks: [web]
    env:
      - SAFEGUARD_MODEL: "gpt-oss-safeguard-120b"
      - CONTROL_PLANE_URL: "https://api.tinfoil.sh"
      - USAGE_REPORTER_ID: "websearch-mcp"
    secrets:
      - EXA_API_KEY
      - CLOUDFLARE_API_TOKEN
      - TINFOIL_API_KEY
      - USAGE_REPORTER_SECRET
      - USAGE_CONTEXT_SECRET

networks:
  web:
    egress: open

shim:
  upstream-port: 8089
  paths:
    - /mcp
    - /health
  authenticated: true
  authenticated-endpoints:
    - /mcp
