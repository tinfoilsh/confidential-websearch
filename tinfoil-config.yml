cvm-version: 0.11.0
cpus: 8
memory: 16384

containers:
  - name: "websearch-mcp"
    image: "ghcr.io/tinfoilsh/confidential-websearch@sha256:ac5bc80e656d47b24489424e357a882012739511bb8413f3c5e5daccb77e1b53" # v0.5.9
    restart: always
    networks: [web]
    env:
      - SAFEGUARD_MODEL: "gpt-oss-safeguard-120b"
      - PII_ENCLAVE: "pii-filter.tinfoil.sh"
      - PII_REPO: "tinfoilsh/confidential-pii-cpu"
      - CONTROL_PLANE_URL: "https://api.tinfoil.sh"
      - USAGE_REPORTER_ID: "websearch-mcp"
    secrets:
      - EXA_API_KEY
      - CLOUDFLARE_API_TOKEN
      - TINFOIL_API_KEY
      - USAGE_REPORTER_SECRET
      - USAGE_CONTEXT_SECRET

networks:
  web:
    egress: open

shim:
  upstream-port: 8089
  paths:
    - /mcp
    - /health
  authenticated: true
  authenticated-endpoints:
    - /mcp
